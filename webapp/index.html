<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opus — Megaboard</title>
  <link rel="stylesheet" href="megaboard.css" />
</head>
<body>
  <header id="bar">
    <span class="brand">Opus<span class="dim"> · megaboard</span></span>
    <label>source
      <select id="source"></select>
    </label>
    <label>grid
      <select id="grid">
        <option value="2">2 × 2</option>
        <option value="3" selected>3 × 3</option>
        <option value="4">4 × 4</option>
        <option value="5">5 × 5</option>
      </select>
    </label>
    <button id="toggle" title="Play / pause all (Space)">Pause</button>
    <button id="reshuffle" title="Fresh mix (R)">Reshuffle</button>
    <label id="floor-wrap" hidden title="Off = one peak from every scene. Raise it to keep only your strongest scenes.">taste floor
      <input type="range" id="floor" min="0" max="0.95" step="0.01" value="0" />
      <span id="floor-val" class="dim">off</span>
    </label>
    <button id="refresh-lib" title="Rebuild from Stash — pick up newly-added scenes / apexes">↻ Refresh</button>
    <button id="save-board" title="Save whatever is currently driving the board as a collection">💾 Save board</button>
    <button id="mute" title="Hover a tile to hear it — M to silence everything">🔊 Sound</button>
    <label id="vol-wrap" title="Volume for the enlarged tile">🔈
      <input type="range" id="volume" min="0" max="1" step="0.05" value="1" />
    </label>
    <span id="status" class="dim"></span>
  </header>

  <main id="board"><!-- tiles injected here --></main>

  <div id="error" hidden></div>

  <script src="megaboard.js"></script>
</body>
</html>
