<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="peaks">
  <defs><clipPath id="tile"><rect width="64" height="64" rx="14"/></clipPath></defs>
  <rect width="64" height="64" rx="14" fill="#0d0d0d"/>
  <!-- three peak outlines on a shared baseline, rising left-to-right; darker
       shade = farther, brighter = nearer. black casing lifts the near peak. -->
  <g clip-path="url(#tile)" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <g stroke="#0d0d0d" stroke-width="7.5">
      <path d="M4 47 L16 34 L28 47"/>
      <path d="M20 47 L32 25 L44 47"/>
      <path d="M36 47 L48 15 L60 47"/>
    </g>
    <path d="M4 47 L16 34 L28 47" stroke="#8f1060" stroke-width="3.4"/>
    <path d="M20 47 L32 25 L44 47" stroke="#c31585" stroke-width="3.4"/>
    <path d="M36 47 L48 15 L60 47" stroke="#ec1ba2" stroke-width="3.4"/>
  </g>
</svg>
