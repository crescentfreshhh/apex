[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "peaks"
version = "0.1.0"
description = "Find and play back the moments you actually care about in a Stash library."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "numpy>=1.24",    # used across scoring/cache/pipeline, not just ML
]

# Heavy ML deps are kept optional so the plumbing + scoring logic install light.
# Install with:  pip install -e ".[ml]"
[project.optional-dependencies]
ml = [
    "torch",          # DINOv2 / CLIP inference
    "open_clip_torch>=3.1",  # the CLIP channel; SigLIP 2 / Perception Encoder in the Lab
    "torchvision",    # DINOv2 image transforms
    "transformers>=4.56",  # DINOv3 (Hugging Face weights, gated by Meta's licence) + CLAP (hearing)
    "timm>=1.0.15",   # V-JEPA 2.1 (motion) through torch.hub; SigLIP 2 / PE towers
    "einops",
    "pillow",
    "scikit-learn",   # the Tier-2 taste classifier
    "av>=12",         # sparse (seek-based) sampling; bundles ffmpeg libs
    "tqdm",
]
label = [
    "gradio>=4",      # the rapid frame-rating tool (Tier 2); >=4 for Blocks(js=...)
]
web = [
    "fastapi>=0.110",   # control-panel + explorer API
    "uvicorn>=0.27",    # ASGI server
    "python-multipart", # form/file uploads (reference stills)
]
dev = [
    "pytest>=7",      # the offline test suite (no torch/ffmpeg/Stash needed)
    "scikit-learn",   # classifier tests exercise the real sklearn estimators
    "av>=12",         # sparse-sampler tests run against real generated video
    "fastapi>=0.110", # web API tests
    "pillow",         # performer-picture cache tests
    "httpx",          # FastAPI TestClient transport
]

[project.scripts]
peaks = "peaks.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"peaks.web" = ["static/*", "static/icons/*", "static/floor/*"]
