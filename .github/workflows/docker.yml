name: Build and publish Docker image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - docker/**
      - src/**
      - webapp/**
      - pyproject.toml
      - config.example.toml
      - .github/workflows/docker.yml
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # the CUDA torch layers are large; reclaim runner disk first
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          # Reuse unchanged layers across runs so the heavy CUDA-torch/deps layers
          # keep stable digests — a code-only update then ships only the small
          # changed layers, so `docker pull` stays small.
          cache-from: type=gha
          cache-to: type=gha,mode=max
